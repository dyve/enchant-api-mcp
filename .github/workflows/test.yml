name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # No credentials in CI: the offline permissions/drift tests run, the live
      # smoke tests skip. Run `npm test` locally with credentials configured to
      # exercise the server against a real account.
      - run: npm test
